<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Agent Drawing Canvas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <canvas id="pad" data-tool="pen" role="img" aria-label="Drawing area"></canvas>
  <div id="eraser-cursor" class="eraser-cursor" aria-hidden="true" hidden></div>

  <h1 id="prompt" class="glass prompt"></h1>

  <div class="glass toolbar" role="toolbar" focusgroup="toolbar wrap" aria-label="Drawing tools" aria-controls="pad">
    <div role="group" aria-label="Tool">
      <button type="button" class="tool" data-tool="pen" aria-pressed="true" aria-label="Pen" title="Pen">
        <svg aria-hidden="true"><use href="icons.svg#pen"/></svg>
      </button>
      <button type="button" class="tool" data-tool="eraser" aria-pressed="false" aria-label="Eraser" title="Eraser">
        <svg aria-hidden="true"><use href="icons.svg#eraser"/></svg>
      </button>
    </div>

    <span role="separator" aria-orientation="vertical"></span>

    <div role="group" aria-label="Color">
      <button type="button" class="swatch" data-color="#1d1d1f" style="--swatch:#1d1d1f" aria-pressed="true" aria-label="Black" title="Black"></button>
      <button type="button" class="swatch" data-color="#007aff" style="--swatch:#007aff" aria-pressed="false" aria-label="Blue" title="Blue"></button>
      <button type="button" class="swatch" data-color="#ff3b30" style="--swatch:#ff3b30" aria-pressed="false" aria-label="Red" title="Red"></button>
      <button type="button" class="swatch" data-color="#34c759" style="--swatch:#34c759" aria-pressed="false" aria-label="Green" title="Green"></button>
      <button type="button" class="swatch" data-color="#ff9500" style="--swatch:#ff9500" aria-pressed="false" aria-label="Orange" title="Orange"></button>
      <button type="button" class="swatch" data-color="#af52de" style="--swatch:#af52de" aria-pressed="false" aria-label="Purple" title="Purple"></button>
      <input type="color" id="custom-color" value="#5856d6" aria-label="Custom color" title="Custom color">
    </div>

    <span role="separator" aria-orientation="vertical"></span>

    <div role="group" aria-label="Stroke width">
      <button type="button" class="size" data-size="2" style="--dot:4px" aria-pressed="false" aria-label="Thin" title="Thin"></button>
      <button type="button" class="size" data-size="5" style="--dot:8px" aria-pressed="true" aria-label="Medium" title="Medium"></button>
      <button type="button" class="size" data-size="10" style="--dot:13px" aria-pressed="false" aria-label="Thick" title="Thick"></button>
    </div>

    <span role="separator" aria-orientation="vertical"></span>

    <div role="group" aria-label="Edit">
      <button type="button" id="undo" aria-label="Undo" title="Undo (⌘Z)">
        <svg aria-hidden="true"><use href="icons.svg#undo"/></svg>
      </button>
      <button type="button" id="clear" aria-label="Clear" title="Clear">
        <svg aria-hidden="true"><use href="icons.svg#trash"/></svg>
      </button>
    </div>

    <span role="separator" aria-orientation="vertical"></span>

    <div role="group" aria-label="Finish">
      <button type="button" id="cancel" class="text">Cancel</button>
      <button type="button" id="done" class="text done">
        <svg aria-hidden="true"><use href="icons.svg#check"/></svg>Done
      </button>
    </div>
  </div>

  <div id="status" class="status" role="status"></div>
</body>
</html>
